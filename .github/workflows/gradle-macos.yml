name: Run gradle build for iOS

on:
  workflow_dispatch:

jobs:
  gradle:
    runs-on: macos-latest
    steps:
      - name: Checkout all repos with ref fallback
        uses: walt-id/waltid-identity/.github/actions/checkout-repos@baaa8f045159798062ddfeeaa481d6e26ae48f2f
        with:
          token: ${{ secrets.GH_ACCESS_TOKEN }}

      - name: Configure gradle
        uses: walt-id/waltid-identity/.github/actions/gradle-setup-action@baaa8f045159798062ddfeeaa481d6e26ae48f2f

      - name: Build iOS Simulator Framework (ARM64)
        uses: walt-id/waltid-identity/.github/actions/gradle-ios@baaa8f045159798062ddfeeaa481d6e26ae48f2f
        with:
          waltid-directory: 'waltid-identity'