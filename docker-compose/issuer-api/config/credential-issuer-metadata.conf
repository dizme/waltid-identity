# NB: le definizioni "ad array" (es. BankId = [VerifiableCredential, BankId]) vengono
# espanse da waltid in ~10 varianti di formato, comprese `jwt_vp_json`, `ldp_vp`,
# `jwt_vc`, `jwt_vp` — che non sono formati di credential ma di presentation.
# La libreria eudi-lib-jvm-openid4vci-kt è strict: un format sconosciuto in
# `credential_configurations_supported` fa fallire silenziosamente tutta la
# deserializzazione dei metadata e il wallet non chiama /token.
# Per SD-JWT VC usa **dc+sd-jwt** (costante FORMAT_SD_JWT_VC nella lib): **vc+sd-jwt**
# non viene mappato sulla classe di serializzazione SdJwtVcCredential → offer fallisce.
# Per questo teniamo solo le entry "a blocco" con format espliciti e validi.

supportedCredentialTypes = {
    "org.iso.18013.5.1.mDL" = {
        format = mso_mdoc
        cryptographic_binding_methods_supported = ["cose_key", "jwk"]
        credential_signing_alg_values_supported = ["ES256"]
        # EUDI openid4vci-kt firma solo proof jwt; cwt tenuto per compatibilità.
        proof_types_supported = {
            jwt = { proof_signing_alg_values_supported = ["ES256"] }
            cwt = { proof_signing_alg_values_supported = ["ES256"] }
        }
        doctype = "org.iso.18013.5.1.mDL"
    }

    "urn:eu.europa.ec.eudi:pid:1" = {
        format = "dc+sd-jwt"
        cryptographic_binding_methods_supported = ["jwk"]
        credential_signing_alg_values_supported = ["ES256"]
        proof_types_supported = { jwt = { proof_signing_alg_values_supported = ["ES256"] } }
        # Stesso pubblico issuer HTTPS di Caddy (porta ISSUER_API_TLS_PORT nel .env)
        vct = "https://${SERVICE_HOST}:${ISSUER_API_TLS_PORT}/draft13/urn:eu.europa.ec.eudi:pid:1"
    }

    "identity_credential_vc+sd-jwt" = {
        format = "dc+sd-jwt"
        cryptographic_binding_methods_supported = ["jwk"]
        credential_signing_alg_values_supported = ["ES256"]
        proof_types_supported = { jwt = { proof_signing_alg_values_supported = ["ES256"] } }
        vct = "https://${SERVICE_HOST}:${ISSUER_API_TLS_PORT}/draft13/identity_credential"
    }
}
