# Definire in docker-compose .env: VERIFIER_DNS_NAME (es. verifier.192-168-1-8.nip.io per SERVICE_HOST=192.168.1.8).
# Deve coincidere col SAN DNS del certificato in x5c e con la chiave key.
clientId: "x509_san_dns:${VERIFIER_DNS_NAME}"

# EUDI: ogni format richiesto in DCQL deve comparire in client_metadata.vp_formats_supported.
# "dc+sd-jwt" in HOCON va tra virgolette.
clientMetadata: {
  vp_formats_supported: {
    mso_mdoc: {
      issuerauth_alg_values: [-7, -9, -50]
      deviceauth_alg_values: [-7, -9, -50, -65537]
    }
    "dc+sd-jwt": {
      "sd-jwt_alg_values": ["ES256"]
      "kb-jwt_alg_values": ["ES256"]
    }
  }
}

urlPrefix: "http://${VERIFIER_DNS_NAME}:${VERIFIER_API2_PORT}/verification-session"

urlHost: "openid4vp://authorize"

key: {"type":"jwk","jwk":{"kty":"EC","crv":"P-256","d":"f1KxEM-PUTOR72DfP589joIocLjfx3kV12duWZ5uVKE","x":"jfqdnSPZreKr7I64r1WOHcr_rTcvLFJ3Jxu5ea__Ydk","y":"fUgBnF26Vvo0UTYzEbYWC-1IXJ0mcGwBazzyB0cqPxo","kid":"IIhcwcgRh2GBH8kCVXhjug"}}
